<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Koperasi Cahaya Bintang</title>
<meta name="robots" content="noindex, nofollow">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="manifest" href="manifest.webmanifest">
<meta name="theme-color" content="#1d4ed8">
<style>
  :root { --bg: #f6f7f9; --card: #fff; --text: #111827; --muted: #6b7280; --accent: #1d4ed8; }
  @media (prefers-color-scheme: dark) { :root { --bg: #0f1115; --card: #171a21; --text: #e5e7eb; --muted: #9ca3af; --accent: #60a5fa; } }
  * { box-sizing: border-box; }
  body { margin: 0; min-height: 100vh; display: grid; place-items: center; padding: 16px; background: var(--bg); color: var(--text); font: 15px/1.5 system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; }
  .card { width: 100%; max-width: 380px; background: var(--card); border-radius: 14px; padding: 28px 24px; box-shadow: 0 1px 3px rgba(0,0,0,.08); text-align: center; }
  .logo { width: 56px; height: 56px; margin: 0 auto 12px; }
  h1 { font-size: 20px; margin: 0 0 4px; }
  p { margin: 0 0 20px; color: var(--muted); font-size: 14px; }
  a.btn { display: block; padding: 11px 16px; border-radius: 10px; background: var(--accent); color: #fff; text-decoration: none; font-weight: 600; }
  small { display: block; margin-top: 16px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<main class="card">
  <img class="logo" src="icon.svg" alt="">
  <h1>Koperasi Cahaya Bintang</h1>
  <p>Aplikasi pengelolaan koperasi. Masuk dengan akun Google, lalu nama pengguna &amp; PIN aplikasi.</p>
  <a class="btn" id="masuk" href="https://script.google.com/macros/s/AKfycbzB_A7uzWq9uNdcu_tzodFxeuDfR7mSNncj-CzxaPpJbUtFz-POavS2oTvSqytiSopCyg/exec" target="_top" rel="noopener">Masuk aplikasi</a>
  <small>Mengalihkan otomatis… Simpan halaman ini ke layar utama ponsel untuk akses cepat.</small>
</main>
<script>
  // Alihkan langsung ke aplikasi (Apps Script). Tombol tetap tersedia bila pengalihan diblokir.
  setTimeout(function () { location.replace(document.getElementById('masuk').href); }, 600);
</script>
</body>
</html>
